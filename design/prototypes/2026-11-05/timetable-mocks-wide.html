<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>課題の秘書 時間割の案（PC幅）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f5f0; --white:#fffefa;
  --ink:#273e37; --body:#3e5149; --muted:#6c766d; --line:#dddeda; --line-soft:#e8e9e2;
  --green:#345d4c; --soft:#e8eee6;
  --gold:#8a601f; --gold-bg:#f9f0dc; --gold-line:#e7d7b5; --gold-ink:#694f2b;
  --today:#a63d2f; /* 赤。今日やらないと間に合わないものだけ。今回のデータでは使わない */
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --c-linear:#e2eaf1; --t-linear:#355068;
  --c-english:#f2e3e2; --t-english:#7a4646;
  --c-thermo:#e4ecdc; --t-thermo:#4a6440;
  --c-physics:#e8e4f0; --t-physics:#564a74;
  --c-info:#dcebe9; --t-info:#375e5b;
  --c-diff:#ece3e8; --t-diff:#6a4b5e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.7 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid #789e8a;outline-offset:3px;border-radius:4px}
a{color:var(--green)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
q{quotes:"「" "」"}

/* ---------- 案の切り替え ---------- */
.bar{min-height:69px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 36px;position:sticky;top:0;z-index:40}
.bar .label{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-right:auto}
.bar .label span{white-space:nowrap}
.bar .label span:first-child{border:1px solid var(--line);border-radius:5px;padding:1px 7px;letter-spacing:.08em}
.tabs{display:flex;gap:5px;background:#eeefe9;padding:4px;border-radius:9px}
.tab{padding:8px 18px;border-radius:6px;white-space:nowrap;font-size:13px;color:var(--muted);line-height:1.5}
.tab b{font-family:var(--serif);font-weight:600;margin-right:6px}
.tab[aria-pressed=true]{background:var(--white);color:var(--green);box-shadow:0 1px 4px #253c2e16;font-weight:700}
.desc{max-width:1200px;margin:18px auto 0;padding:0 36px;font-size:13px;color:var(--body)}
.desc b{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--green);margin-right:8px}

/* ---------- 画面 ---------- */
.page{max-width:1200px;margin:0 auto;padding:22px 36px 60px}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 22px}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:.08em;font-weight:700;font-size:15px}
.brand-mark{display:flex;align-items:center;justify-content:center;background:var(--green);color:var(--white);width:31px;height:34px;border-radius:8px 8px 8px 2px}
.brand-mark svg{width:21px;height:21px}
.identity{color:var(--muted);font-size:12px}
.identity strong{color:var(--body);font-weight:500;margin-right:5px}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.heading h1{font-family:var(--serif);font-weight:600;font-size:32px;letter-spacing:.035em;line-height:1.3}
.heading .right{display:flex;align-items:center;gap:18px;padding-bottom:6px}
.meet{font-size:13px;color:var(--body)}
.meet strong{color:var(--green);font-weight:700}
.seg{display:inline-flex;gap:3px;background:#eeefe9;padding:3px;border-radius:8px}
.seg button{padding:5px 14px;border-radius:6px;font-size:12px;color:var(--muted);line-height:1.6}
.seg button[aria-pressed=true]{background:var(--white);color:var(--green);font-weight:700;box-shadow:0 1px 4px #253c2e16}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.layout.with-panel{grid-template-columns:minmax(0,1fr) 340px}
.grid-wrap{overflow-x:auto;overscroll-behavior-x:contain}
.tt{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:6px;min-width:720px}
.tt.weekend{grid-template-columns:64px repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.62fr))}
.tt .dh{text-align:center;font-size:12px;color:var(--muted);line-height:1.3;padding:4px 0 8px}
.tt .dh strong{display:block;font:600 20px/1.2 var(--serif);color:var(--ink);letter-spacing:.02em}
.tt .dh.today strong{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--green);color:var(--white);font-size:16px}
.tt .dh.wk strong{color:var(--muted);font-size:17px}
.tt .ph{font-size:11px;color:var(--muted);line-height:1.3;display:flex;flex-direction:column;justify-content:center;padding-right:4px}
.tt .ph b{font:600 15px/1.2 var(--serif);color:var(--body);display:block;margin-bottom:3px}
.tt .cell{border-radius:10px;min-height:84px;background:#eeeee8;border:1px solid transparent}
.tt .cell.today{background:#e9ece4}
.tt .cell.wkcell{background:#f2f2ec}
.tt .course{display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.4;color:var(--ink);background:var(--soft);text-align:left;width:100%}
.tt .course:hover{filter:brightness(.97)}
.tt .course[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--green)}
.tt .course.linear{background:var(--c-linear);color:var(--t-linear)}
.tt .course.english{background:var(--c-english);color:var(--t-english)}
.tt .course.thermo{background:var(--c-thermo);color:var(--t-thermo)}
.tt .course.physics{background:var(--c-physics);color:var(--t-physics)}
.tt .course.info{background:var(--c-info);color:var(--t-info)}
.tt .course.diff{background:var(--c-diff);color:var(--t-diff)}
.tt .meet-block{border:1.5px solid var(--green);background:#f3f7f1;color:var(--green);display:flex;flex-direction:column;justify-content:center;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.4}
.tt .meet-block small{font-size:11px;font-weight:400;color:var(--body)}
/* A：マスの中の札 */
.chip{display:block;font-size:11.5px;font-weight:400;line-height:1.45;padding:5px 8px;border-radius:6px;background:#ffffffb8;color:var(--body);margin-top:auto}
.chip b{display:block;color:var(--green);font-weight:700}
.chip.two{background:var(--gold-bg);color:var(--gold-ink);border:1px solid var(--gold-line)}
.chip.two b{color:var(--gold)}
.chip.done b{display:inline-flex;align-items:center;gap:4px}
.chip.done svg{width:13px;height:13px}
.A .tt .cell{min-height:104px}
/* B：日の列の上の締切の行 */
.tt .rowlabel{font-size:11px;color:var(--muted);display:flex;align-items:flex-start;padding-top:6px}
.tt .dayrow{display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--line);padding:0 0 10px;min-height:44px}
.tt .dl{font-size:12px;line-height:1.4;border-radius:6px;padding:6px 8px 6px 9px;background:var(--soft);color:var(--body);border-left:3px solid var(--green);text-align:left;width:100%}
.tt .dl small{display:block;font-size:11px;color:var(--muted)}
.tt .dl b{display:block;font-weight:700;color:var(--ink)}
.tt .dl .t{color:var(--green);font-weight:700}
.tt .dl.two{background:var(--gold-bg);border-left-color:var(--gold)}
.tt .dl.two .t{color:var(--gold)}
.tt .dl.prep{background:transparent;border-left-color:#cfdccf;color:var(--muted)}
.tt .dl.prep b{color:var(--muted);font-weight:500}
.tt .dl.done{background:transparent;border-left-color:transparent;padding-left:0}
.tt .dl.done .t{display:inline-flex;align-items:center;gap:4px}
.tt .dl.done svg{width:13px;height:13px}
.B .tt .course{justify-content:center}
/* C：空いているコマの候補 */
.tt .cand{border:1.5px dashed #a3b4a7;background:#f7f8f3;color:var(--body);font-size:12.5px;font-weight:500;line-height:1.45;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:left;width:100%}
.tt .cand small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.C .tt .course{justify-content:center}
.cnote{margin-top:16px;font-size:13px;color:var(--body);line-height:1.8;padding:12px 16px;background:var(--white);border:1px solid var(--line);border-radius:9px;display:flex;gap:10px;align-items:flex-start}
.cnote .sw{display:inline-block;width:18px;height:12px;border:1.5px dashed #a3b4a7;border-radius:3px;margin-top:6px;background:#f7f8f3;flex-shrink:0}
.foot{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.foot svg{width:14px;height:14px}

/* ---------- 横の詳細 ---------- */
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:22px 24px 24px;position:sticky;top:88px}
.panel .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.panel h2{font:600 21px/1.4 var(--serif);letter-spacing:.02em}
.panel .when{font-size:12px;color:var(--muted)}
.panel .close{width:30px;height:30px;display:grid;place-items:center;background:#eef0e9;border-radius:50%}
.panel .close svg{width:14px;height:14px}
.panel .task{border-top:1px solid var(--line-soft);padding:14px 0 4px}
.panel .task h3{font-size:15px;font-weight:700;margin-bottom:4px}
.panel .task .d{font-size:13px;color:var(--body)}
.panel .task .d strong{color:var(--green);font-weight:700}
.panel .task .d.ok{color:var(--green);display:flex;align-items:center;gap:5px}
.panel .task .d.ok svg{width:14px;height:14px}
.panel .task .p{font-size:12px;color:var(--muted);margin-top:2px}
.panel .two-note{margin-top:8px;font-size:12px;color:var(--gold-ink);background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:7px;padding:8px 10px;line-height:1.7}
.detail-link{color:var(--muted);padding:6px 0;font-size:12px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#b7c1b4;display:inline-flex;align-items:center;gap:7px}
.detail-link::after{content:"＋";font-size:13px;text-decoration:none}
.detail-link[aria-expanded=true]::after{content:"−"}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s ease}
.fold>div{overflow:hidden}
.fold.open{grid-template-rows:1fr}
.source-block{border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-top:8px;background:var(--white)}
.source-block.warning{background:var(--gold-bg);border-color:var(--gold-line)}
.source-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.source-block p{font-size:13px;line-height:1.8}
.lms-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--green);margin-top:6px;text-decoration:none}
.lms-link svg{width:12px;height:12px}

@media (max-width:1000px){
  .layout.with-panel{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
}
@media (max-width:900px){.bar .label{display:none}.tabs{margin-left:auto}}
@media (max-width:620px){
  .bar{padding:10px 14px;gap:8px}
  .tabs{width:100%}
  .tab{flex:1;padding:8px 6px;text-align:center;font-size:12px}
  .tab span{display:none}
  .tab b{margin-right:0;font-size:16px}
  .desc{padding:0 16px}
  .page{padding:16px 16px 40px}
  .heading h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){.fold{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/><path d="M9 15l2 2 4-4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
</svg>

<header class="bar">
  <div class="label"><span>画面の試作</span><span>課題の秘書 · 時間割の案（PC幅）</span></div>
  <nav class="tabs" aria-label="案を切り替え">
    <button class="tab" aria-pressed="true" data-dir="A"><b>A</b><span>授業のマスに締切</span></button>
    <button class="tab" aria-pressed="false" data-dir="B"><b>B</b><span>締切を日の列に</span></button>
    <button class="tab" aria-pressed="false" data-dir="C"><b>C</b><span>空いたコマに準備</span></button>
  </nav>
</header>

<p class="desc" id="desc"></p>

<main class="page A" id="page">
  <header class="app-header">
    <div class="brand"><span class="brand-mark"><svg><use href="#i-mark"/></svg></span>課題の秘書</div>
    <div class="identity"><strong>青木 ひかり</strong>さん</div>
  </header>
  <div class="heading">
    <div><p class="eyebrow">11月12日 木曜日</p><h1>時間割</h1></div>
    <div class="right">
      <p class="meet">森先生との面談 <strong>あす 11:00</strong></p>
      <div class="seg" role="group" aria-label="週"><button aria-pressed="true" data-week="0">今週</button><button aria-pressed="false" data-week="1">来週</button></div>
    </div>
  </div>
  <div class="layout" id="layout">
    <div>
      <div class="grid-wrap" id="gridHost"></div>
      <div id="below"></div>
      <p class="foot"><svg><use href="#i-cal"/></svg>締切と準備の予定はカレンダーにも入っています</p>
    </div>
    <aside class="panel" id="panel" hidden></aside>
  </div>
</main>

<script>
(function () {
  var W = ['月','火','水','木','金','土','日'];
  function wd(d){ return W[(d + 5) % 7]; } // 2026年11月：12日が木曜
  var TODAY = 12, MEET = 13;
  var periods = [
    {n:1, s:'8:50', e:'10:20'}, {n:2, s:'10:30', e:'12:00'}, {n:3, s:'13:00', e:'14:30'},
    {n:4, s:'14:40', e:'16:10'}, {n:5, s:'16:15', e:'17:45'}
  ];
  var courses = {
    linear:  {name:'線形代数',             short:'線形代数',     day:0, p:2},
    english: {name:'英語プレゼンテーション', short:'英語プレゼン', day:1, p:3},
    thermo:  {name:'熱力学',               short:'熱力学',       day:2, p:1},
    physics: {name:'現代物理学入門',       short:'現代物理',     day:2, p:4},
    info:    {name:'情報リテラシー',       short:'情報リテラシー', day:3, p:4},
    diff:    {name:'微分方程式',           short:'微分方程式',   day:4, p:1}
  };
  var tasks = [
    {c:'linear',  title:'演習レポート第5回',          due:13, time:'17:00', prep:10,
      src:[{l:'課題ページ「演習レポート第5回」', t:'締切 <q>11月13日（金）17:00</q>'}]},
    {c:'english', title:'発表スライドの提出',          due:18, time:'23:59', prep:15,
      src:[{l:'課題ページ「発表スライドの提出」（11月10日に出た課題）', t:'締切 <q>11月18日（水）23:59</q>'}]},
    {c:'thermo',  title:'小レポート「エントロピー」',  due:20, time:'17:00', prep:17, oldDue:16,
      src:[{l:'課題ページ「小レポート「エントロピー」」', t:'締切の欄が <q>11月16日（月）17:00</q> から <q>11月20日（金）17:00</q> に変わりました'}]},
    {c:'info',    title:'課題3 データ整理',            due:19, time:'23:59', prep:14, alt:17,
      src:[{l:'課題の欄', t:'<q>11月19日（木）23:59</q>'}, {l:'11月11日のお知らせ', t:'<q>課題3は11/17までに変更します</q>', warn:true}]},
    {c:'diff',    title:'演習問題10',                  due:11, time:'17:00', done:'15:40',
      src:[{l:'課題ページ「演習問題10」', t:'提出 <q>11月11日 15:40</q>（締切 11月11日（水）17:00）'}]},
    {c:'physics', title:'期末レポートの題目の提出',    due:27, time:'17:00', prep:24,
      src:[{l:'課題ページ「期末レポートの題目の提出」（11月10日に出た課題）', t:'締切 <q>11月27日（金）17:00</q>'}]}
  ];
  // C：空いているコマに置く候補（準備を始める日から締切までの平日）
  var candidates = [
    {day:12, p:3, c:'linear',  text:'演習レポート第5回の準備'},
    {day:13, p:3, c:'linear',  text:'演習レポート第5回の準備'},
    {day:16, p:3, c:'english', text:'発表スライドの準備'},
    {day:16, p:4, c:'info',    text:'課題3 データ整理の準備'},
    {day:17, p:2, c:'thermo',  text:'小レポートの準備'},
    {day:19, p:2, c:'thermo',  text:'小レポートの準備'}
  ];
  var DESC = {
    A: '<b>A</b>授業のマスに締切を付ける。時間割が主役で、各授業のマスに次の締切を添える。マスを押すと、その授業の課題が右に出る。',
    B: '<b>B</b>締切を日の列に置く。1限の上にその日の締切の行を作り、授業のマスは色だけにする。準備を始める日は同じ行に薄く出す（土日も列に含める）。',
    C: '<b>C</b>空いているコマに準備の時間を置く。準備を始める日から締切までの空きコマに、点線の「候補」を置く。入れるかどうかは面談で決める。'
  };
  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg>';
  function dayDate(week, day) { return (week === 0 ? 9 : 16) + day; }
  function taskOf(id) { return tasks.filter(function (t) { return t.c === id; }); }
  function dateLabel(d) { return d + '日（' + wd(d) + '）'; }

  function chip(t) {
    if (t.done) return '<span class="chip done">' + t.title + '<b>' + CHECK + '出せました</b></span>';
    if (t.alt) return '<span class="chip two">' + t.title + '<b>' + dateLabel(t.due) + 'まで ・ 日付が2つ</b></span>';
    return '<span class="chip">' + t.title + '<b>' + dateLabel(t.due) + ' ' + t.time + ' まで</b></span>';
  }

  function renderGrid(dir, week) {
    var days = dir === 'B' ? 7 : 5;
    var h = '<div class="tt' + (days === 7 ? ' weekend' : '') + '" role="table" aria-label="' + (week === 0 ? '今週' : '来週') + 'の時間割"><div></div>';
    for (var d = 0; d < days; d++) {
      var date = dayDate(week, d);
      h += '<div class="dh' + (date === TODAY ? ' today' : '') + (d >= 5 ? ' wk' : '') + '"><strong>' + date + '</strong>' + wd(date) + '</div>';
    }
    if (dir === 'B') {
      h += '<div class="rowlabel">締切</div>';
      for (var d2 = 0; d2 < days; d2++) {
        var dt = dayDate(week, d2), items = '';
        tasks.forEach(function (t) {
          var c = courses[t.c];
          if (t.done && t.due === dt) items += '<button class="dl done" data-course="' + t.c + '"><small>' + c.short + '</small><b>' + t.title + '</b><span class="t">' + CHECK + '出せました</span></button>';
          if (!t.done && t.alt === dt) items += '<button class="dl two" data-course="' + t.c + '"><small>' + c.short + '</small><b>' + t.title + '</b><span class="t">日付が2つ（お知らせでは' + dt + '日）</span></button>';
          if (!t.done && t.due === dt) items += '<button class="dl' + (t.alt ? ' two' : '') + '" data-course="' + t.c + '"><small>' + c.short + '</small><b>' + t.title + '</b><span class="t">' + t.time + (t.alt ? ' ・ 日付が2つ' : '') + '</span></button>';
          if (!t.done && t.prep === dt) items += '<button class="dl prep" data-course="' + t.c + '"><small>' + c.short + '</small><b>' + t.title + '</b>準備を始める日</button>';
        });
        h += '<div class="dayrow">' + items + '</div>';
      }
    }
    periods.forEach(function (p) {
      h += '<div class="ph"><b>' + p.n + '限</b>' + p.s + '–' + p.e + '</div>';
      for (var d3 = 0; d3 < days; d3++) {
        var date3 = dayDate(week, d3), id = null;
        for (var k in courses) if (courses[k].day === d3 && courses[k].p === p.n) id = k;
        if (id) {
          var c3 = courses[id], inner = '<span>' + c3.short + '</span>';
          if (dir === 'A') taskOf(id).filter(function (t) { return t.done || t.due >= TODAY; }).forEach(function (t) { inner += chip(t); });
          h += '<button class="cell course ' + id + '" data-course="' + id + '">' + inner + '</button>';
        } else if (date3 === MEET && p.n === 2) {
          h += '<div class="cell meet-block">森先生との面談<small>11:00</small></div>';
        } else {
          var cand = dir === 'C' ? candidates.filter(function (x) { return x.day === date3 && x.p === p.n; })[0] : null;
          if (cand) h += '<div class="cell cand"><small>候補</small>' + courses[cand.c].short + ' ' + cand.text + '</div>';
          else h += '<div class="cell' + (date3 === TODAY ? ' today' : '') + (d3 >= 5 ? ' wkcell' : '') + '"></div>';
        }
      }
    });
    h += '</div>';
    return h;
  }

  function panelFor(id) {
    var c = courses[id], pr = periods[c.p - 1];
    var h = '<div class="sh"><div><h2>' + c.name + '</h2><p class="when">' + W[c.day] + '曜 ' + c.p + '限 ' + pr.s + '–' + pr.e + '</p></div><button class="close" aria-label="閉じる"><svg><use href="#i-x"/></svg></button></div>';
    taskOf(id).forEach(function (t) {
      h += '<div class="task"><h3>' + t.title + '</h3>';
      if (t.done) {
        h += '<p class="d ok">' + CHECK + '出せました（' + dateLabel(t.due) + ' ' + t.done + '）</p>';
      } else {
        h += '<p class="d">締切 <strong>' + dateLabel(t.due) + ' ' + t.time + '</strong></p>';
        if (t.oldDue) h += '<p class="p">11月9日に ' + t.oldDue + '日 から延びました</p>';
        h += '<p class="p">' + dateLabel(t.prep) + 'から準備</p>';
        if (t.alt) h += '<p class="two-note">課題の欄は' + dateLabel(t.due) + '、お知らせには' + dateLabel(t.alt) + 'と書いてあります。カレンダーは' + t.due + '日のまま、予定名に「要確認」を付けました。</p>';
      }
      h += '<button class="detail-link" aria-expanded="false" data-toggle>書いてあったことを見る</button><div class="fold"><div>';
      t.src.forEach(function (s) {
        h += '<div class="source-block' + (s.warn ? ' warning' : '') + '"><p class="source-label">' + s.l + '</p><p>' + s.t + '</p><a class="lms-link" href="#" onclick="return false">LMSで見る<svg><use href="#i-ext"/></svg></a></div>';
      });
      h += '</div></div></div>';
    });
    return h;
  }

  var page = document.getElementById('page'), layout = document.getElementById('layout');
  var host = document.getElementById('gridHost'), below = document.getElementById('below');
  var panel = document.getElementById('panel'), desc = document.getElementById('desc');
  var dir = 'A', week = 0, current = null;

  function draw() {
    host.innerHTML = renderGrid(dir, week);
    below.innerHTML = dir === 'C' ? '<p class="cnote"><span class="sw"></span><span>点線は候補です。入れるかどうかは、あすの面談で森先生と一緒に決めます。何も入れないこともできます。</span></p>' : '';
    desc.innerHTML = DESC[dir];
    page.className = 'page ' + dir;
    markCurrent();
  }
  function markCurrent() {
    host.querySelectorAll('.course').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.course === current)); });
  }
  function openPanel(id) {
    current = id;
    panel.innerHTML = panelFor(id);
    panel.hidden = false;
    layout.classList.add('with-panel');
    markCurrent();
  }
  function closePanel() {
    current = null; panel.hidden = true; layout.classList.remove('with-panel'); markCurrent();
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-pressed', String(x === t)); });
      dir = t.dataset.dir; draw();
    });
  });
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      week = +b.dataset.week; draw();
    });
  });
  host.addEventListener('click', function (e) {
    var b = e.target.closest('[data-course]');
    if (!b) return;
    if (b.dataset.course === current) { closePanel(); return; }
    openPanel(b.dataset.course);
  });
  panel.addEventListener('click', function (e) {
    if (e.target.closest('.close')) { closePanel(); return; }
    var t = e.target.closest('[data-toggle]');
    if (!t) return;
    var open = t.getAttribute('aria-expanded') === 'true';
    t.setAttribute('aria-expanded', String(!open));
    var f = t.nextElementSibling; if (f) f.classList.toggle('open', !open);
  });
  draw();
})();
</script>
</body>
</html>
